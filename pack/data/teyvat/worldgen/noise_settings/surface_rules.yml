type: 'minecraft:sequence'
sequence:
  # Bedrock Floor
  - type: 'minecraft:condition'
    if_true:
      type: 'minecraft:vertical_gradient'
      false_at_and_above:
        above_bottom: 5
      random_name: 'minecraft:bedrock_floor'
      true_at_and_below:
        above_bottom: 0
    then_run:
      type: 'minecraft:block'
      result_state:
        Name: 'minecraft:bedrock'
  # Deepslate Phase
  - type: 'minecraft:condition'
    if_true:
      type: 'minecraft:vertical_gradient'
      false_at_and_above:
        absolute: 8
      random_name: 'minecraft:deepslate'
      true_at_and_below:
        absolute: 0
    then_run:
      type: 'minecraft:block'
      result_state:
        Name: 'minecraft:deepslate'
        Properties:
          axis: 'y'
  # Natlan Specific
  - type: 'minecraft:condition'
    if_true:
      type: 'minecraft:biome'
      biome_is:
        - 'teyvat:natlan'
    then_run:
      type: 'minecraft:sequence'
      sequence:
        - type: 'minecraft:condition'
          if_true:
            type: 'minecraft:stone_depth'
            add_surface_depth: false
            offset: 0
            secondary_depth_range: 0
            surface_type: floor
          then_run:
            type: condition
            if_true:
              type: 'minecraft:water'
              offset: 0
              add_stone_depth: false
              surface_depth_multiplier: 1
            then_run:
              type: 'minecraft:block'
              result_state:
                Name: 'minecraft:grass_block'
        - type: 'minecraft:condition'
          if_true:
            type: 'minecraft:stone_depth'
            add_surface_depth: false
            offset: 1
            secondary_depth_range: 0
            surface_type: floor
          then_run:
            type: 'minecraft:block'
            result_state:
              Name: 'minecraft:packed_mud'
        - type: 'minecraft:condition'
          if_true:
            type: 'minecraft:not'
            invert:
              type: 'minecraft:vertical_gradient'
              random_name: terracotta_gradient
              true_at_and_below:
                absolute: 54
              false_at_and_above:
                absolute: 60
          then_run:
            type: sequence
            sequence:
              - type: 'minecraft:condition'
                if_true:
                  type: 'minecraft:noise_threshold'
                  max_threshold: 0.0125
                  min_threshold: -0.0125
                  noise: 'teyvat:natlan_blue_terracotta'
                then_run:
                  type: 'minecraft:block'
                  result_state:
                    Name: 'minecraft:blue_terracotta'
              - type: 'minecraft:block'
                result_state:
                  Name: 'minecraft:terracotta'
  # Liyue Specific
  - type: 'minecraft:condition'
    if_true:
      type: 'minecraft:biome'
      biome_is:
        - 'teyvat:liyue'
    then_run:
      type: sequence
      sequence:
        - type: 'minecraft:condition'
          if_true:
            type: 'minecraft:stone_depth'
            add_surface_depth: false
            offset: 0
            secondary_depth_range: 0
            surface_type: floor
          then_run:
            type: condition
            if_true:
              type: 'minecraft:water'
              offset: 0
              add_stone_depth: false
              surface_depth_multiplier: 1
            then_run:
              type: 'minecraft:block'
              result_state:
                Name: 'minecraft:grass_block'
        - type: 'minecraft:condition'
          if_true:
            type: 'minecraft:stone_depth'
            add_surface_depth: false
            offset: 1
            secondary_depth_range: 3
            surface_type: floor
          then_run:
            type: 'minecraft:block'
            result_state:
              Name: 'minecraft:dirt'
